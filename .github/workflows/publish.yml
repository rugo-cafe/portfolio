# File: .github/workflows/publish.yml
name: publish-astro-to-github-pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro-redesign/package-lock.json

      - name: Install dependencies
        working-directory: astro-redesign
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Astro
        working-directory: astro-redesign
        run: npm run build

      - name: Debug build output
        run: |
          pwd
          node -v
          npm -v
          ls -la
          ls -la astro-redesign
          ls -la astro-redesign/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-redesign/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
